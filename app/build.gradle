apply plugin: 'com.android.application'

String resolveYandexMapkitKey() {
    def fromEnv = System.getenv('YANDEX_MAPKIT_API_KEY')
    if (fromEnv) {
        return fromEnv
    }
    def localProps = new Properties()
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { localProps.load(it) }
        def fromProps = localProps.getProperty('YANDEX_MAPKIT_API_KEY')
        if (fromProps) {
            return fromProps
        }
    }
    return ''
}

android {
    namespace "com.barrieropener.app"

    compileSdkVersion 36

    defaultConfig {
        minSdk 28
        targetSdkVersion 31
        versionCode rootProject.ext.appVersionCode
        versionName rootProject.ext.appVersionName

        // Set the output APK name (matches the status-widget pattern).
        setProperty("archivesBaseName", "barrier-opener-${versionName}")

        buildConfigField "String", "YANDEX_MAPKIT_API_KEY", "\"${resolveYandexMapkitKey()}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file('../keystore.jks')
            storePassword System.getenv("KEY_PASSWORD")
            keyAlias "key0"
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release

            // Release ships a single architecture (audience runs arm64-v8a). abiFilters (not ABI
            // splits) keeps the output one file named "barrier-opener-<ver>-release.apk" with no
            // architecture suffix, so the release workflow can rename it deterministically.
            ndk {
                abiFilters "arm64-v8a"
            }
        }
        debug {
            debuggable true
            // Emulator-friendly set, minus the unused 32-bit ARM (no armeabi-v7a): runs on arm64
            // and x86/x86_64 emulators.
            ndk {
                abiFilters "arm64-v8a", "x86", "x86_64"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    lint {
        // The app targets API 31 on purpose (audience is Android 10–12 head units) and is not
        // published on Google Play, so the "target API must be 33+" rule must not fail the build.
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation libs.appcompat
//    implementation libs.core
    implementation libs.constraintlayout
    implementation libs.coordinatorlayout
    implementation libs.material
    implementation libs.yandex.mapkit

    testImplementation 'junit:junit:4.13.2'
}
