# Compiles and tests every pushed branch, without the release secrets: a debug build signs with
# the runner's own debug key, so this proves the code builds — it is not an APK for the car (the
# signature differs from the installed release, and MapKit is dead without the key).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: android-actions/setup-android@v2

      - name: Unit tests and debug build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
