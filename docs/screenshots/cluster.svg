<svg xmlns="http://www.w3.org/2000/svg" viewBox="360 100 1200 620" width="1200" height="620" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Copyright © 2026 smart-car-software. GPL-3.0-or-later.
       Mock-up of the gate question on the Geely Monjaro instrument cluster, as Car Notification
       Service draws it (CardView: 460 px wide, 288 px from the top of the 1920×720 cluster).
       Not a screenshot: the gauges around the card are only a sketch. -->
  <title>Вопрос на приборке Monjaro</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="60%" r="70%">
      <stop offset="0" stop-color="#1B2633"/><stop offset="1" stop-color="#07090C"/>
    </radialGradient>
    <clipPath id="crop"><rect x="360" y="100" width="1200" height="620" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#crop)">
    <rect x="360" y="100" width="1200" height="620" fill="url(#bg)"/>

    <!-- Top bar -->
    <text x="420" y="138" font-size="24" fill="#9AA4B0">+4 °C</text>
    <text x="960" y="138" font-size="26" fill="#F2F5F8" text-anchor="middle">18:42</text>
    <text x="1500" y="138" font-size="24" fill="#9AA4B0" text-anchor="end">12 480 км</text>
    <rect x="760" y="154" width="400" height="3" rx="1.5" fill="#4FB7F0" opacity="0.8"/>

    <!-- Speed -->
    <path d="M410 560 A 170 170 0 1 1 690 560" fill="none" stroke="#2A3644" stroke-width="10" stroke-linecap="round"/>
    <path d="M410 560 A 170 170 0 0 1 430 330" fill="none" stroke="#4FB7F0" stroke-width="10" stroke-linecap="round"/>
    <text x="550" y="470" font-size="110" font-weight="300" fill="#F2F5F8" text-anchor="middle">12</text>
    <text x="550" y="512" font-size="26" fill="#7D8896" text-anchor="middle">км/ч</text>

    <!-- Gear -->
    <path d="M1230 560 A 170 170 0 1 1 1510 560" fill="none" stroke="#2A3644" stroke-width="10" stroke-linecap="round"/>
    <text x="1370" y="470" font-size="110" font-weight="300" fill="#F2F5F8" text-anchor="middle">D</text>
    <text x="1370" y="512" font-size="26" fill="#7D8896" text-anchor="middle" letter-spacing="10">P R N D</text>

    <!-- The navigator's own hint, above which nothing of ours is drawn -->
    <rect x="780" y="186" width="360" height="84" rx="10" fill="#283442" fill-opacity="0.85" stroke="#55657A" stroke-width="2"/>
    <path d="M820 252 v-30 a10 10 0 0 1 10 -10 h22 v-10 l18 18 l-18 18 v-10 h-18 v24z" fill="#F2F5F8"/>
    <text x="890" y="222" font-size="26" fill="#F2F5F8">150 м</text>
    <text x="890" y="254" font-size="20" fill="#7D8896">Лесная улица</text>

    <!-- The card -->
    <rect x="730" y="288" width="460" height="112" rx="10" fill="#283442" fill-opacity="0.85" stroke="#55657A" stroke-width="2"/>
    <text x="960" y="331" font-size="26" fill="#F2F5F8" text-anchor="middle">Открыть шлагбаум Дом?</text>
    <rect x="752" y="346" width="200" height="40" rx="8" fill="#4FB7F0" fill-opacity="0.35" stroke="#4FB7F0" stroke-width="2"/>
    <text x="852" y="375" font-size="24" fill="#F2F5F8" text-anchor="middle">Да</text>
    <text x="1068" y="375" font-size="24" fill="#F2F5F8" text-anchor="middle">Нет</text>

    <!-- Road -->
    <path d="M900 720 L 945 430 M1020 720 L 975 430" stroke="#2A3644" stroke-width="4"/>
    <path d="M960 700 v-30 M960 640 v-24 M960 590 v-18 M960 552 v-14 M960 522 v-10" stroke="#3B4A5C" stroke-width="4"/>
  </g>
</svg>
