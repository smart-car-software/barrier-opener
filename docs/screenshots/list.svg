<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Copyright © 2026 smart-car-software. GPL-3.0-or-later.
       Mock-up of the barrier list (MainActivity, dark theme), drawn from activity_main.xml and
       item_barrier.xml. Not a screenshot: names, URLs and coordinates are made up. -->
  <title>Список шлагбаумов</title>
  <rect width="1600" height="600" rx="18" fill="#15171C"/>

  <!-- Header -->
  <text x="28" y="62" font-size="30" font-weight="700" fill="#F1F3F4">Настройка открывателя шлагбаума</text>
  <g fill="none" stroke="#B8BCC2" stroke-width="3">
    <circle cx="1268" cy="52" r="11"/><circle cx="1268" cy="52" r="4"/>
    <circle cx="1322" cy="52" r="13"/>
  </g>
  <rect x="1320" y="50" width="4" height="10" fill="#B8BCC2"/><circle cx="1322" cy="44" r="2.4" fill="#B8BCC2"/>
  <rect x="1360" y="32" width="210" height="40" rx="20" fill="#2A2D35"/>
  <circle cx="1386" cy="52" r="7" fill="#1E8E3E"/>
  <text x="1402" y="58" font-size="18" fill="#F1F3F4">Активно</text>

  <!-- Card: Gate API -->
  <rect x="24" y="96" width="1552" height="176" rx="18" fill="#1F2128" stroke="#3A3D45"/>
  <text x="52" y="138" font-size="28" font-weight="700" fill="#F1F3F4">Дом</text>
  <rect x="1206" y="114" width="164" height="32" rx="16" fill="#2A2D35"/>
  <text x="1288" y="136" font-size="17" fill="#B8BCC2" text-anchor="middle">Двусторонний</text>
  <rect x="1380" y="114" width="104" height="32" rx="16" fill="#2A2D35"/>
  <circle cx="1398" cy="130" r="6" fill="#1E8E3E"/>
  <text x="1442" y="136" font-size="17" font-weight="700" fill="#F1F3F4" text-anchor="middle">Закрыты</text>
  <text x="52" y="172" font-size="20" fill="#B8BCC2">https://gate-api.example.com</text>
  <text x="52" y="198" font-size="17" fill="#B8BCC2">55.751244, 37.618423 (80 м)</text>
  <rect x="52" y="214" width="708" height="44" rx="22" fill="#3B3A2A"/>
  <text x="406" y="243" font-size="19" font-weight="600" fill="#FFE97A" text-anchor="middle">Открыть</text>
  <rect x="772" y="214" width="708" height="44" rx="22" fill="#3B3A2A"/>
  <text x="1126" y="243" font-size="19" font-weight="600" fill="#FFE97A" text-anchor="middle">Закрыть</text>
  <circle cx="1528" cy="184" r="30" fill="#FFD400"/>
  <path d="M1516 172 l8 -4 l5 10 l-5 4 q4 9 11 13 l4 -5 l10 5 l-4 8 q-24 -2 -29 -31z" fill="#1F2128"/>

  <!-- Card: webhook -->
  <rect x="24" y="286" width="1552" height="118" rx="18" fill="#1F2128" stroke="#3A3D45"/>
  <text x="52" y="328" font-size="28" font-weight="700" fill="#F1F3F4">Ворота дачи</text>
  <rect x="1320" y="304" width="164" height="32" rx="16" fill="#2A2D35"/>
  <text x="1402" y="326" font-size="17" fill="#B8BCC2" text-anchor="middle">Односторонний</text>
  <text x="52" y="362" font-size="20" fill="#B8BCC2">http://192.168.1.10:8123/api/webhook/open_gate</text>
  <text x="52" y="388" font-size="17" fill="#B8BCC2">55.912034, 37.402118 (120 м)</text>
  <circle cx="1528" cy="345" r="30" fill="#FFD400"/>
  <path d="M1516 333 l8 -4 l5 10 l-5 4 q4 9 11 13 l4 -5 l10 5 l-4 8 q-24 -2 -29 -31z" fill="#1F2128"/>

  <!-- Card: GSM call -->
  <rect x="24" y="418" width="1552" height="118" rx="18" fill="#1F2128" stroke="#3A3D45"/>
  <text x="52" y="460" font-size="28" font-weight="700" fill="#F1F3F4">Шлагбаум во дворе</text>
  <rect x="1320" y="436" width="164" height="32" rx="16" fill="#2A2D35"/>
  <text x="1402" y="458" font-size="17" fill="#B8BCC2" text-anchor="middle">Двусторонний</text>
  <text x="52" y="494" font-size="20" fill="#B8BCC2">+7 900 000-00-00</text>
  <text x="52" y="520" font-size="17" fill="#B8BCC2">55.748810, 37.610277 (50 м)</text>
  <circle cx="1528" cy="477" r="30" fill="#FFD400"/>
  <path d="M1516 465 l8 -4 l5 10 l-5 4 q4 9 11 13 l4 -5 l10 5 l-4 8 q-24 -2 -29 -31z" fill="#1F2128"/>

  <!-- Extended FAB -->
  <rect x="1270" y="540" width="306" height="52" rx="18" fill="#FFD400"/>
  <path d="M1300 566 h20 M1310 556 v20" stroke="#1F2128" stroke-width="3.5" stroke-linecap="round"/>
  <text x="1336" y="573" font-size="20" font-weight="600" fill="#1F2128">Добавить шлагбаум</text>
</svg>
