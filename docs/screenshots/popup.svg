<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Copyright © 2026 smart-car-software. GPL-3.0-or-later.
       Mock-up of the approach popup (BarrierPopupActivity, dark theme) over a navigator, drawn from
       activity_barrier_popup.xml. Not a screenshot: names are made up. -->
  <title>Попап «Открыть шлагбаум?»</title>
  <defs>
    <clipPath id="screen"><rect width="1600" height="600" rx="18"/></clipPath>
    <pattern id="stripes" width="36" height="20" patternUnits="userSpaceOnUse">
      <rect width="18" height="20" fill="#D93025"/><rect x="18" width="18" height="20" fill="#FFFFFF"/>
    </pattern>
  </defs>
  <g clip-path="url(#screen)">
    <!-- A navigator underneath -->
    <rect width="1600" height="600" fill="#2B3038"/>
    <g stroke="#454C57" stroke-width="26" fill="none" stroke-linecap="round">
      <path d="M-20 420 C 300 400, 520 300, 900 320 S 1400 200, 1640 160"/>
      <path d="M380 -20 L 470 640"/>
      <path d="M1180 -20 C 1150 200, 1220 400, 1160 640"/>
    </g>
    <path d="M430 640 L 440 440 C 520 320, 700 310, 900 320" stroke="#4FB7F0" stroke-width="12" fill="none" stroke-linecap="round"/>
    <rect width="1600" height="600" fill="#000" opacity="0.6"/>

    <!-- Popup card -->
    <rect x="420" y="22" width="760" height="556" rx="28" fill="#1F2128" stroke="#3A3D45"/>

    <!-- Hero: a striped barrier arm on a post -->
    <rect x="740" y="64" width="22" height="84" rx="4" fill="#5F6368"/>
    <rect x="728" y="140" width="46" height="10" rx="3" fill="#5F6368"/>
    <rect x="762" y="78" width="126" height="20" rx="4" fill="url(#stripes)"/>
    <circle cx="751" cy="88" r="9" fill="#FFD400"/>

    <text x="800" y="200" font-size="38" font-weight="700" fill="#F1F3F4" text-anchor="middle">Открыть шлагбаум: Дом?</text>
    <text x="800" y="238" font-size="24" fill="#B8BCC2" text-anchor="middle">Закрыты</text>

    <rect x="473" y="262" width="190" height="74" rx="16" fill="#1E8E3E"/>
    <text x="568" y="312" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">ДА</text>
    <rect x="675" y="262" width="190" height="74" rx="16" fill="#D93025"/>
    <text x="770" y="312" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">НЕТ</text>
    <rect x="877" y="262" width="250" height="74" rx="16" fill="#1A73E8"/>
    <text x="1002" y="310" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Подождать</text>

    <text x="800" y="378" font-size="22" fill="#B8BCC2" text-anchor="middle">Автозакрытие через 10 сек.</text>

    <rect x="460" y="400" width="680" height="1" fill="#3A3D45"/>
    <text x="460" y="436" font-size="21" font-weight="700" fill="#B8BCC2">Также в зоне:</text>
    <text x="460" y="488" font-size="26" fill="#F1F3F4">Шлагбаум во дворе</text>
    <rect x="980" y="452" width="160" height="54" rx="14" fill="#1E8E3E"/>
    <text x="1060" y="487" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Звонок</text>
  </g>
</svg>
